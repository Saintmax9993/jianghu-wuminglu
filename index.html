'use strict';const KEY='jianghu_wuming_v1';const places={town:{name:'青石鎮',desc:'雨後的青石板映著燈籠光，酒肆與鏢局人聲未歇。',routes:['forest','luoyang'],danger:0},forest:{name:'竹影林',desc:'竹影深深，偶有刀光在薄霧間閃過。',routes:['town','valley'],danger:1},valley:{name:'斷雲谷',desc:'峭壁環繞的險谷，傳說藏有失落的武學殘篇。',routes:['forest'],danger:2},luoyang:{name:'洛陽城',desc:'商賈雲集，武林人士在此交換消息與恩怨。',routes:['town','mountain'],danger:0},mountain:{name:'蒼嵐山門',desc:'鐘聲穿雲，蒼嵐派弟子在石階上晨練。',routes:['luoyang'],danger:0}};const skills={basic:{name:'基礎劍法',cost:0,power:8},wind:{name:'流雲劍',cost:8,power:18},palm:{name:'破山掌',cost:12,power:25}};let S=null,tab='江湖',battle=null;const $=id=>document.getElementById(id);const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// v0.3 NPC 日程：時間以遊戲內整點計，跨日依目前小時重新計算。
const NPC_DB={
 su:{name:'蘇晚晴',title:'回春堂醫女',personality:'溫柔謹慎、重視承諾',goal:'守護父親留下的青囊遺篇',secret:'醫書牽涉天絕峰舊案',schedule:[{from:0,to:6,place:'town',action:'在回春堂休息'},{from:6,to:12,place:'town',action:'整理藥材、替鎮民診治'},{from:12,to:17,place:'forest',action:'入竹影林採藥'},{from:17,to:22,place:'town',action:'在回春堂配藥'},{from:22,to:24,place:'town',action:'研讀父親留下的醫書'}]},
 gu:{name:'顧長風',title:'流浪劍客',personality:'灑脫好義、心藏舊恨',goal:'查清師門滅門真相',secret:'曾與幽冥樓交手',schedule:[{from:0,to:7,place:'luoyang',action:'在洛陽客棧歇息'},{from:7,to:12,place:'luoyang',action:'在武館練劍'},{from:12,to:18,place:'mountain',action:'往蒼嵐山門訪友'},{from:18,to:24,place:'luoyang',action:'在客棧飲酒打聽消息'}]},
 ye:{name:'夜無霜',title:'幽冥樓刺客',personality:'冷靜寡言、行事果決',goal:'尋找脫離幽冥樓的方法',secret:'暗中懷疑上級命令',schedule:[{from:0,to:9,place:'valley',action:'在谷中隱匿休整'},{from:9,to:13,place:'forest',action:'在竹林查探行蹤'},{from:13,to:18,place:'forest',action:'執行幽冥樓密令'},{from:18,to:24,place:'valley',action:'返回秘密據點'}]}
};
function ensureNPC(){if(!S)return;if(!S.npcs||typeof S.npcs!=='object')S.npcs={};for(const id of Object.keys(NPC_DB)){if(!S.npcs[id])S.npcs[id]={met:false,lastSeen:null,notes:[]};}if(!S.companions)S.companions={};for(const id of ['su','gu','ye'])if(S.companions[NPC_DB[id].name]===undefined)S.companions[NPC_DB[id].name]=0;}
function legacy_npcNow(id){const n=NPC_DB[id];if(!n)return null;const entry=n.schedule.find(x=>S.hour>=x.from&&S.hour<x.to);return entry||n.schedule[0];}
function npcHere(id){return !!S&&npcNow(id).place===S.place;}
function legacy_npcVisit(id){ensureNPC();const n=NPC_DB[id];if(!n)return;if(!npcHere(id)){writeLog(`${n.name}此時不在${places[S.place].name}，可在「人物日程」查看線索。`);render();return;}S.npcs[id].met=true;S.npcs[id].lastSeen=`第${S.day}日 ${String(S.hour).padStart(2,'0')}:00，${places[S.place].name}`;if(id==='ye'){writeLog('你在竹影間瞥見夜無霜，她留下警告後轉身隱去。');S.companions[n.name]+=1;tick(1);auto();render();return;}talk(id);}
function waitHours(h){if(battle){writeLog('交戰之際無法等待。');render();return;}tick(h);writeLog(`原地等候 ${h} 時辰，江湖人物的行程隨之改變。`);auto();render();}
function legacy_viewNPCSchedule(){ensureNPC();return `<h2>人物日程</h2><p class="small muted">目前：第 ${S.day} 日 ${String(S.hour).padStart(2,'0')}:00。NPC 依每日行程活動；目前為規則式日程原型。</p><div class="actions">${btn('等候 1 時','waitHours(1)')}${btn('等候 3 時','waitHours(3)')}${btn('等候 6 時','waitHours(6)')}</div><div class="grid">${Object.entries(NPC_DB).map(([id,n])=>{const at=npcNow(id),here=npcHere(id),rec=S.npcs[id];return `<div class="tile"><h3>${n.name}</h3><p class="small muted">${n.title}</p><p class="small">${n.personality}</p><p class="small">志向：${n.goal}</p><p class="small">目前：${places[at.place].name} · ${at.action}</p><span class="badge">${here?'就在附近':'不在此地'}</span><p class="small muted">${rec.lastSeen?'上次相遇：'+safe(rec.lastSeen):'尚無相遇紀錄'}</p>${btn('尋訪交談',`npcVisit('${id}')`,'',!here)}</div>`}).join('')}</div><h3 style="margin-top:18px">日程時刻表</h3>${Object.entries(NPC_DB).map(([id,n])=>`<div class="event-chip"><h3>${n.name}</h3>${n.schedule.map(x=>`<p class="small">${String(x.from).padStart(2,'0')}:00–${String(x.to).padStart(2,'0')}:00　${places[x.place].name} · ${x.action}</p>`).join('')}</div>`).join('')}`;}
function initial(name,origin){let a={strength:5,agility:5,wisdom:5};a[origin==='wanderer'?'agility':origin==='scholar'?'wisdom':'strength']+=2;return {version:1,name,origin,day:1,hour:8,place:'town',hp:100,maxHp:100,mp:40,maxMp:40,level:1,xp:0,silver:80,repute:0,karma:0,stats:a,skills:['basic'],items:{'金瘡藥':3,'乾糧':2,'舊銅令':1},flags:{letter:false,bandits:false,secret:false,joined:false},sect:'無門無派',sectRep:0,companions:{'蘇晚晴':0,'顧長風':0},logs:['你在青石鎮醒來，雨夜的鐘聲尚在耳畔。'],missions:0}}function writeLog(t){S.logs.unshift(`第${S.day}日 · ${t}`);S.logs=S.logs.slice(0,45)}function legacy_tick(h=1){ensureNPC();S.hour+=h;while(S.hour>=24){S.hour-=24;S.day++;} }function save(quiet=false){if(!S)return;localStorage.setItem(KEY,JSON.stringify(S));if(!quiet){writeLog('江湖行跡已存入本機。');render()}}function auto(){save(true)}function newGame(){let name=$('nameInput').value.trim()||'無名客';S=initial(name,$('originInput').value);ensureNPC();$('startModal').classList.add('hidden');tab='江湖';render();auto()}function continueGame(){try{let d=JSON.parse(localStorage.getItem(KEY));if(!d||d.version!==1)throw Error();S=d;ensureNPC();$('startModal').classList.add('hidden');render()}catch{alert('找不到可讀取的存檔')}}function resetGame(){if(confirm('確定刪除目前進度，重新闖蕩江湖？')){$('startModal').classList.remove('hidden');$('continueBtn').disabled=true;localStorage.removeItem(KEY);S=null}}function exportSave(){if(!S)return;let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='江湖無名錄-存檔.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importSave(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(d.version!==1||!places[d.place]||typeof d.name!=='string'||!Array.isArray(d.logs)||!d.flags||!d.stats||!d.items)throw Error();S=d;battle=null;tab='江湖';auto();render();alert('匯入成功')}catch{alert('存檔格式不正確')}};reader.readAsText(input.files[0])};input.click()}function gainXP(n){S.xp+=n;while(S.xp>=S.level*35){S.xp-=S.level*35;S.level++;S.maxHp+=15;S.maxMp+=7;S.hp=S.maxHp;S.mp=S.maxMp;writeLog(`突破至第 ${S.level} 重！氣血與內力提升。`)}}function legacy_render(){if(!S)return;$('clock').textContent=`大雍二十三年 · 第 ${S.day} 日 · ${String(S.hour).padStart(2,'0')}:00`;$('locationLabel').textContent=places[S.place].name;$('profile').innerHTML=`<b>${safe(S.name)}</b><div class="small muted">${safe(S.sect)} · 境界 ${S.level} 重</div><div class="stat"><span>氣血</span><span>${S.hp}/${S.maxHp}</span></div><div class="bar"><i style="width:${Math.max(0,100*S.hp/S.maxHp)}%"></i></div><div class="stat"><span>內力</span><span>${S.mp}/${S.maxMp}</span></div><div class="bar blue"><i style="width:${Math.max(0,100*S.mp/S.maxMp)}%"></i></div>${[['修為',`${S.xp}/${S.level*35}`],['銀兩',S.silver],['江湖聲望',S.repute],['俠義',S.karma],['臂力',S.stats.strength],['身法',S.stats.agility],['悟性',S.stats.wisdom]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}`;$('inventory').innerHTML=Object.entries(S.items).filter(x=>x[1]>0).map(([k,v])=>`<div class="stat"><span>${safe(k)}</span><b>×${v}</b></div>`).join('')||'<p class="muted">空空如也</p>';$('quest').innerHTML=`<p><b>主線：雨夜遺書</b></p><p class="small">${!S.flags.letter?'向青石鎮的蘇晚晴打聽染血密信。':!S.flags.bandits?'前往竹影林追查黑衣人的蹤跡。':!S.flags.secret?'到斷雲谷尋找銅令的秘密。':'序章完成！可自由探索、修練或加入門派。'}</p><p class="small muted">已完成委託：${S.missions}</p>`;$('log').innerHTML=S.logs.map(t=>`<div>${safe(t)}</div>`).join('');let tabs=['江湖','探索','武學','人物','人物日程','行當','戰鬥'];$('tabs').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="changeTab('${t}')">${t}</button>`).join('');let html=tab==='江湖'?viewWorld():tab==='探索'?viewExplore():tab==='武學'?viewSkills():tab==='人物'?viewPeople():tab==='人物日程'?viewNPCSchedule():tab==='行當'?viewWork():viewBattle();$('scene').innerHTML=html}function changeTab(t){tab=t;render()}function btn(label,call,cls='',disabled=false){return `<button class="${cls}" onclick="${call}" ${disabled?'disabled':''}>${label}</button>`}function viewWorld(){ensureNPC();return `<h2>${places[S.place].name}</h2><p>${places[S.place].desc}</p><div class="notice">${S.place==='town'&&!S.flags.letter?'客棧內，一位素衣女子似乎在等候某人。':S.place==='forest'&&!S.flags.bandits?'林間有刀兵碰撞的聲響，似乎有人遭到埋伏。':S.place==='valley'&&!S.flags.secret?'山壁上刻著與舊銅令相似的紋路。':'風雲變幻，江湖之路由你決定。'}</div><h3>附近人物</h3><div class="actions">${Object.keys(NPC_DB).filter(npcHere).map(id=>btn(NPC_DB[id].name,`npcVisit('${id}')`)).join('')||'<span class="small muted">此刻附近沒有主要人物。</span>'}</div><h3>當前行動</h3><div class="actions">${S.place==='town'?btn('拜訪蘇晚晴',"npcVisit('su')",'',!npcHere('su'))+btn('投宿客棧 · 12兩','rest()'):''}${S.place==='forest'?btn('搜尋黑衣人蹤跡','forestEvent()'):''}${S.place==='valley'?btn('探查石壁秘文','valleyEvent()'):''}${S.place==='luoyang'?btn('拜訪顧長風',"npcVisit('gu')",'',!npcHere('gu'))+btn('逛洛陽集市','market()'):''}${S.place==='mountain'?btn('拜入蒼嵐派','joinSect()')+btn('山門修習','train()'):''}</div><h3>行旅路線</h3><div class="grid">${places[S.place].routes.map(k=>`<div class="tile"><strong>${places[k].name}</strong><p class="small muted">${places[k].danger?'山野險路':'官道通達'}</p>${btn('前往此地',`travel('${k}')`)}</div>`).join('')}</div>`}function travel(to){if(battle)return;tick(3);S.place=to;writeLog(`行至${places[to].name}。`);if(places[to].danger&&Math.random()<.33){startBattle(to==='valley'?'山谷盜匪':'攔路山賊')}else{tab='江湖'}auto();render()}function viewExplore(){return `<h2>遊歷四方</h2><p>探索需要時間，也可能遇到機緣與危險。</p><div class="grid">${Object.entries(places).map(([id,p])=>`<div class="tile"><strong>${p.name}</strong><p class="small">${p.desc}</p><span class="badge">${S.place===id?'目前所在地':p.danger?'險地':'城鎮'}</span></div>`).join('')}</div><div class="actions">${btn('四處探查','explore()')}${btn('打坐調息','meditate()')}${btn('查看江湖',"changeTab('江湖')")}</div>`}function explore(){tick(2);let r=rand(1,5);if(r===1){let n=rand(8,22);S.silver+=n;writeLog(`偶然拾得無主銀兩 ${n} 兩。`)}else if(r===2){S.items['金瘡藥']=(S.items['金瘡藥']||0)+1;writeLog('在荒廟中找到一瓶金瘡藥。')}else if(r===3){gainXP(12+S.stats.wisdom);writeLog('觀摩江湖前輩練武，略有所悟。')}else if(r===4&&places[S.place].danger){startBattle('流寇')}else{S.repute+=1;writeLog('幫助路人解決難題，江湖聲望 +1。')}auto();render()}function meditate(){tick(2);S.mp=Math.min(S.maxMp,S.mp+22+S.stats.wisdom);S.hp=Math.min(S.maxHp,S.hp+10);writeLog('靜坐吐納，氣息漸穩。');auto();render()}function viewSkills(){return `<h2>武學修習</h2><p>武學招式消耗內力，境界提高可增強氣血與內力。</p><div class="grid">${Object.entries(skills).map(([id,s])=>`<div class="tile"><strong>${s.name}</strong><p class="small muted">威力 ${s.power} · 內力 ${s.cost}</p><span class="badge">${S.skills.includes(id)?'已習得':'未習得'}</span></div>`).join('')}</div><h3 style="margin-top:20px">修練</h3><div class="actions">${btn('苦練基本功 · 3時','train()')}${btn('打坐調息 · 2時','meditate()')}${btn('服用金瘡藥','heal()','',!S.items['金瘡藥'])}</div><p class="small muted">流雲劍：完成序章取得；破山掌：蒼嵐派傳授。</p>`}function train(){tick(3);gainXP(14+S.stats.wisdom);S.mp=Math.max(0,S.mp-5);writeLog('勤練招式，修為有所精進。');auto();render()}function heal(){if(!S.items['金瘡藥'])return;S.items['金瘡藥']--;S.hp=Math.min(S.maxHp,S.hp+45);writeLog('服下金瘡藥，氣血回復。');auto();render()}function viewPeople(){ensureNPC();return `<h2>江湖人物</h2><div class="grid"><div class="tile"><div class="portrait">蘇晚晴 · 江湖醫女</div><p>蘇晚晴</p><p class="small">心思細膩，似乎知道雨夜血案的內情。</p><span class="badge">交情 ${S.companions['蘇晚晴']}</span>${btn('交談',"npcVisit('su')",'',!npcHere('su'))}</div><div class="tile"><div class="portrait">顧長風 · 遊俠劍客</div><p>顧長風</p><p class="small">行事灑脫，喜歡與人切磋劍術。</p><span class="badge">交情 ${S.companions['顧長風']}</span>${btn('交談',"npcVisit('gu')",'',!npcHere('gu'))}</div></div><p class="small muted">後續版本擴充師徒、結義、情緣、同行與 NPC 日程。</p>`}function talk(who){ensureNPC();if(!npcHere(who)){writeLog('此人現在不在此地，請查看人物日程。');render();return;}if(who==='su'){S.companions['蘇晚晴']+=2;tick(1);if(!S.flags.letter){S.flags.letter=true;S.items['染血密信']=1;writeLog('蘇晚晴將染血密信交給你：「竹影林裡有人等著殺你。」');showDialog('蘇晚晴','「這封信，是有人以性命換來的。你若要查真相，就去竹影林，但千萬小心。」')}else{writeLog('與蘇晚晴談起江湖舊事。');showDialog('蘇晚晴','「有時救一個人，比打敗十個敵人更難。」')}}else{S.companions['顧長風']+=2;tick(1);gainXP(5);writeLog('顧長風與你論劍，修為略增。');showDialog('顧長風','「劍可斷金，卻斷不了人心。來，喝完這杯再比一場！」')}auto();render();$('scene').insertAdjacentHTML('afterbegin',dialogHtml)}let dialogHtml='';function showDialog(name,line){dialogHtml=`<div class="dialog"><h3>${name}</h3><p>${line}</p>${btn('收起對話','render()')}</div>`}function legacy_forestEvent(){if(!S.flags.letter){writeLog('你尚不清楚該追查何人，先回青石鎮打聽。');render();return}if(S.flags.bandits){writeLog('黑衣人早已散去，只留下凌亂的腳印。');render();return}startBattle('幽冥樓殺手',true);render()}function valleyEvent(){if(!S.flags.bandits){writeLog('石壁文字殘缺，似乎缺少關鍵線索。');render();return}if(!S.flags.secret){S.flags.secret=true;S.items['無相殘頁']=1;if(!S.skills.includes('wind'))S.skills.push('wind');S.silver+=60;S.repute+=12;gainXP(45);writeLog('以舊銅令開啟石壁暗格，獲得無相殘頁與流雲劍訣。序章完成！');auto()}else writeLog('石壁暗格已空。');render()}function rest(){if(S.silver<12){writeLog('銀兩不足，無法投宿。');render();return}S.silver-=12;tick(8);S.hp=S.maxHp;S.mp=S.maxMp;writeLog('投宿客棧，休養生息。');auto();render()}function market(){if(S.silver<20){writeLog('你摸了摸錢袋，銀兩不足。');render();return}S.silver-=20;S.items['金瘡藥']=(S.items['金瘡藥']||0)+1;tick(1);writeLog('在洛陽集市花 20 兩購得金瘡藥。');auto();render()}function joinSect(){if(S.sect!=='無門無派'){writeLog('你已有門派，暫不能另投師門。');render();return}if(S.level<2){writeLog('守山弟子說：「待你修至第二重，再來求見掌門。」');render();return}S.sect='蒼嵐派';S.flags.joined=true;S.sectRep=10;S.repute+=8;if(!S.skills.includes('palm'))S.skills.push('palm');writeLog('你拜入蒼嵐派，習得破山掌。');auto();render()}function viewWork(){return `<h2>江湖行當</h2><p>不問身世，亦可憑雙手闖出一條路。</p><div class="grid"><div class="tile"><strong>鏢局護送</strong><p class="small">耗時 5 時，可能遭遇流寇。報酬 35 兩。</p>${btn('承接護鏢','jobEscort()')}</div><div class="tile"><strong>採藥濟世</strong><p class="small">耗時 3 時，獲得銀兩與俠義。</p>${btn('上山採藥','jobHerbs()')}</div><div class="tile"><strong>茶館說書</strong><p class="small">耗時 2 時，累積聲望與修為。</p>${btn('登臺說書','jobStory()')}</div></div><p class="small muted">門派建設、商鋪、領地及勢力爭奪預定後續階段實作。</p>`}function jobEscort(){tick(5);if(Math.random()<.45){startBattle('劫鏢山賊',false,'escort')}else{S.silver+=35;S.repute+=2;S.missions++;writeLog('護送鏢車平安抵達，獲得 35 兩。')}auto();render()}function jobHerbs(){tick(3);S.silver+=18;S.karma+=2;S.missions++;gainXP(7);writeLog('採藥救助村民，獲得 18 兩與俠義。');auto();render()}function jobStory(){tick(2);S.silver+=9;S.repute+=2;S.missions++;gainXP(9);writeLog('茶館滿堂喝采，獲得 9 兩與聲望。');auto();render()}function startBattle(name,main=false,job=''){battle={name,hp:main?85:rand(42,65),maxHp:main?85:65,attack:main?16:11,main,job,guard:false};tab='戰鬥';writeLog(`遭遇${name}！`)}function viewBattle(){if(!battle)return `<h2>刀劍歸鞘</h2><p>目前沒有戰鬥。可前往山野探索，或承接護鏢委託。</p>${btn('返回江湖',"changeTab('江湖')")}`;return `<h2>回合戰鬥</h2><p class="enemy">敵人：${safe(battle.name)}</p><div class="stat"><span>敵人氣血</span><span>${Math.max(0,battle.hp)}/${battle.maxHp}</span></div><div class="bar"><i style="width:${Math.max(0,100*battle.hp/battle.maxHp)}%"></i></div><p>選擇招式出手。防禦能減輕本回合所受傷害。</p><div class="actions">${S.skills.map(k=>btn(`${skills[k].name}（內力 ${skills[k].cost}）`,`attack('${k}')`,'',S.mp<skills[k].cost)).join('')}${btn('運氣防禦','defend()')}${btn('金瘡藥','battleHeal()','',!S.items['金瘡藥'])}${btn('嘗試撤退','flee()')}</div>`}function attack(id){if(!battle||S.mp<skills[id].cost)return;S.mp-=skills[id].cost;let dmg=Math.max(1,skills[id].power+S.stats.strength*2+S.level*2+rand(-5,5));battle.hp-=dmg;writeLog(`使出${skills[id].name}，對${battle.name}造成 ${dmg} 傷害。`);if(battle.hp<=0){win();return}enemyTurn();auto();render()}function enemyTurn(){if(!battle)return;let dmg=Math.max(1,battle.attack+rand(-4,5)-Math.floor(S.stats.agility/3)-(battle.guard?9:0));battle.guard=false;S.hp-=dmg;writeLog(`${battle.name}反擊，造成 ${dmg} 傷害。`);if(S.hp<=0){S.hp=Math.max(15,Math.floor(S.maxHp*.3));S.silver=Math.max(0,S.silver-20);writeLog('你負傷昏迷，被路過的樵夫救回青石鎮，遺失至多 20 兩。');S.place='town';tick(8);battle=null;tab='江湖'}}function defend(){if(!battle)return;battle.guard=true;S.mp=Math.min(S.maxMp,S.mp+5);writeLog('凝神守勢，內力回復 5 點。');enemyTurn();auto();render()}function battleHeal(){if(!battle||!S.items['金瘡藥'])return;heal();if(battle)enemyTurn();auto();render()}function flee(){if(!battle)return;if(battle.main){writeLog('殺手封住退路，無法撤退！');enemyTurn()}else if(Math.random()<.65){writeLog('你施展身法，成功脫身。');battle=null;tab='江湖'}else{writeLog('撤退失敗！');enemyTurn()}auto();render()}function legacy_win(){let b=battle;let reward=b.main?50:rand(12,28);S.silver+=reward;S.repute+=b.main?8:2;gainXP(b.main?35:18);writeLog(`擊敗${b.name}，獲得 ${reward} 兩。`);if(b.main){S.flags.bandits=true;S.items['谷口拓片']=1;writeLog('殺手身上搜得谷口拓片，指向斷雲谷。')}if(b.job){S.silver+=35;S.missions++;writeLog('護鏢成功，另獲 35 兩。')}battle=null;tab='江湖';auto();render()}window.addEventListener('beforeunload',()=>{if(S)auto()});$('startModal').classList.remove('hidden');$('continueBtn').disabled=!localStorage.getItem(KEY);

let currentStory=null,storyHistory=[],storyBusy=false;
function ensureStory(){if(!S)return;S.storyFlags??={};S.storyJournal??=[];S.storySeen??={};S.companions??={'蘇晚晴':0,'顧長風':0};}
function recordStory(t){ensureStory();S.storyJournal.unshift(`第${S.day}日 · ${t}`);S.storyJournal=S.storyJournal.slice(0,100)}
function launchStory(id){if(!S||!STORY[id]||battle)return;ensureStory();currentStory=id;storyHistory=[];storyBusy=false;drawStory()}
function storyEligible(c){let r=c.requires;if(!r)return true;if(r.wisdom&&S.stats.wisdom<r.wisdom)return false;if(r.gu&&S.companions['顧長風']<r.gu)return false;return true}
function applyStory(e){if(!e)return;ensureStory();if(e.karma)S.karma+=e.karma;if(e.wisdom)S.stats.wisdom+=e.wisdom;if(e.repute)S.repute+=e.repute;if(e.silver)S.silver+=e.silver;if(e.xp)gainXP(e.xp);if(e.relation){if(e.relation.su)S.companions['蘇晚晴']+=e.relation.su;if(e.relation.gu)S.companions['顧長風']+=e.relation.gu}if(e.flag){S.storyFlags[e.flag]=true;if(['letter','secret'].includes(e.flag))S.flags[e.flag]=true}if(e.flag2)S.storyFlags[e.flag2]=true;if(e.item)S.items[e.item]=(S.items[e.item]||0)+1;if(e.skill&&!S.skills.includes(e.skill))S.skills.push(e.skill);if(e.log){writeLog(e.log);recordStory(e.log)}if(e.battle){closeStory();startBattle(e.battle,true);render()}}
function drawStory(){if(!currentStory)return;let n=STORY[currentStory];let modal=document.getElementById('storyOverlay');if(!modal){modal=document.createElement('div');modal.id='storyOverlay';modal.className='story-overlay';document.body.append(modal)}modal.innerHTML=`<section class="story-box" role="dialog" aria-modal="true" aria-label="劇情對話"><div class="story-art" data-scene="${n.art}"><div class="story-silhouette" aria-hidden="true">${n.icon}</div></div><div class="story-body"><div class="story-top"><span class="story-chapter">${safe(n.chapter)}</span><button class="story-close" onclick="closeStory()">暫離劇情 ✕</button></div><div class="story-name">${safe(n.speaker)}</div><div class="story-line">${safe(n.text.replaceAll('\\n','\n'))}</div><div class="story-choices">${n.choices.map((c,i)=>`<button onclick="chooseStory(${i})" ${storyEligible(c)?'':'disabled'}>${safe(c.label)}${storyEligible(c)?'':'（條件未達成）'}</button>`).join('')}</div><div class="story-meta">你的選擇將影響人物交情、俠義、線索及故事發展 · 可隨時暫離</div></div></section>`;modal.classList.remove('hidden')}
function chooseStory(i){if(storyBusy||!currentStory)return;let n=STORY[currentStory],c=n.choices[i];if(!c||!storyEligible(c))return;storyBusy=true;ensureStory();S.storySeen[currentStory]=true;recordStory(`${n.chapter}｜${n.speaker}：${c.label}`);applyStory(c.effects);if(c.to){currentStory=c.to;storyBusy=false;drawStory()}else{closeStory();render()}auto()}
function closeStory(){currentStory=null;storyBusy=false;document.getElementById('storyOverlay')?.classList.add('hidden')}
function storyRelations(){ensureStory();return `<h2>人物羈絆</h2><p class="small muted">交情隨對話選擇改變，達成條件可解鎖專屬事件。</p>${[['蘇晚晴','江湖醫女','town','su'],['顧長風','遊俠劍客','luoyang','gu']].map(([name,desc,place,id])=>{let v=S.companions[name];return `<div class="event-chip"><h3>${name} <span class="small muted">${desc}</span></h3><div class="small">交情 ${v} · ${v>=8?'知己':v>=4?'熟識':v>=0?'初識':'戒備'}</div><div class="relationship"><i style="width:${Math.max(0,Math.min(100,v*8))}%"></i></div><p class="small muted">${S.place===place?'目前可交談':'需前往'+places[place].name}</p>${btn('與其交談',`talk('${id}')`,'',S.place!==place)}</div>`}).join('')}`}
function storyJournalView(){ensureStory();return `<h2>江湖劇情誌</h2><p class="small muted">重要對話與選擇會自動記錄，並保存在原有存檔中。</p><div class="notice">${S.flags.secret?'序章已完結：無相殘頁到手。':S.flags.bandits?'線索：斷雲谷的石壁。':S.flags.letter?'線索：竹影林的黑衣人。':'線索：青石客棧的蘇晚晴。'}</div><div class="story-journal">${S.storyJournal.length?S.storyJournal.map(t=>`<p class="small">${safe(t)}</p>`).join(''):'<p>你的江湖傳奇尚待書寫。</p>'}</div>`}
const oldNewGame=newGame;newGame=function(){oldNewGame();ensureStory();recordStory('雨夜血案，命運初啟。');auto();launchStory('intro')};
const oldContinue=continueGame;continueGame=function(){oldContinue();if(S)ensureStory()};
const oldRender=render;render=function(){if(!S)return;ensureStory();oldRender();let t=$('tabs');t.insertAdjacentHTML('beforeend',`<button class="${tab==='羈絆'?'active':''}" onclick="changeTab('羈絆')">羈絆</button><button class="${tab==='劇情誌'?'active':''}" onclick="changeTab('劇情誌')">劇情誌</button>`);if(tab==='羈絆')$('scene').innerHTML=storyRelations();if(tab==='劇情誌')$('scene').innerHTML=storyJournalView();};
talk=function(who){if(!S||battle)return;tick(1);if(who==='su'&&S.place==='town')launchStory(S.flags.letter?'suReturn':'suFirst');else if(who==='gu'&&S.place==='luoyang')launchStory(S.storyFlags?.guMet?'guReturn':'guFirst');else{writeLog('此人不在附近。');render()}};
forestEvent=function(){if(!S.flags.letter){writeLog('尚無足夠線索，先回客棧打聽。');render();return}if(S.flags.bandits){launchStory('forestAfter');return}launchStory('forestStart')};
valleyEvent=function(){if(!S.flags.bandits){writeLog('石壁文字殘缺，似乎缺少關鍵線索。');render();return}if(S.flags.secret){writeLog('石室已空，殘卷的秘密仍待揭曉。');render();return}launchStory('valleyStart')};
const oldWin=win;win=function(){let main=battle?.main;oldWin();if(main){ensureStory();recordStory('擊敗幽冥樓殺手，得到斷雲谷拓片。');launchStory('forestAfter')}};
const oldReset=resetGame;resetGame=function(){closeStory();oldReset()};
const oldImport=importSave;
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentStory)closeStory()});

// v0.4 自主決策與事件模組：所有狀態寫入原有 v1 存檔，舊檔可遷移。

function ensureWorld(){ensureNPC();if(!S.world)S.world={events:{bamboo:'pending'},rumors:[],decisions:[],npcMood:{su:0,gu:0,ye:0},npcMemory:[],lastProcessed:S.day*24+S.hour,threat:0};if(!S.world.events)S.world.events={bamboo:'pending'};if(!S.world.rumors)S.world.rumors=[];if(!S.world.decisions)S.world.decisions=[];if(!S.world.npcMood)S.world.npcMood={su:0,gu:0,ye:0};if(!S.world.npcMemory)S.world.npcMemory=[];if(!Number.isFinite(S.world.lastProcessed))S.world.lastProcessed=S.day*24+S.hour;}
function addRumor(msg){ensureWorld();if(!S.world.rumors.some(x=>x.text===msg)){S.world.rumors.unshift({text:msg,day:S.day});S.world.rumors=S.world.rumors.slice(0,15);writeLog('江湖風聞：'+msg)}}
function addMemory(id,text){ensureWorld();S.world.npcMemory.unshift({id,text,day:S.day});S.world.npcMemory=S.world.npcMemory.slice(0,25);S.npcs[id].notes.push(text);S.npcs[id].notes=S.npcs[id].notes.slice(-8)}
function npcNow(id){if(!S)return null;ensureWorld();const w=S.world,e=w.events.bamboo;let base=legacy_npcNow(id);if(e==='battle'&&id==='su')return {place:'forest',action:'遭刺客圍困，等待援助'};if(e==='battle'&&id==='ye')return {place:'forest',action:'正在執行刺殺任務'};if(e==='captured'&&id==='ye')return {place:'town',action:'被官府拘押'};if(e==='injured'&&id==='su'&&S.day<=w.injuryUntil)return {place:'town',action:'臥床養傷，暫停採藥'};if(e==='rescued'&&id==='su'&&S.day<=w.rescueDay+1)return {place:'town',action:'回春堂休養，思索竹林之事'};if(e==='escaped'&&id==='ye')return {place:'valley',action:'潛伏養傷，躲避追捕'};if(e==='captured'&&id==='gu'&&S.hour>=12&&S.hour<18)return {place:'town',action:'調查幽冥樓劫囚傳聞'};return base;}
function processWorldHour(){ensureWorld();const w=S.world,e=w.events.bamboo;if(e==='pending'&&S.flags.letter&&S.day===1&&S.hour>=13&&S.hour<17){w.events.bamboo='battle';addRumor('有人看見幽冥樓刺客在竹影林出沒。')}
if(e==='battle'&&(S.hour>=18||S.day>1)){w.events.bamboo='injured';w.injuryUntil=S.day+2;w.threat+=1;addRumor('竹影林傳出打鬥聲，蘇家醫女負傷返鎮。');addMemory('su','玩家未及時趕到竹林，自己負傷脫險。')}
if(e==='rescued'&&S.day>=w.rescueDay+3&&!w.threeDay){w.threeDay=true;addRumor('回春堂的蘇姑娘正尋找昔日救她的俠客。')}
if(e==='rescued'&&S.day>=w.rescueDay+7&&!w.sevenDay){w.sevenDay=true;addRumor(w.decision==='mercy'?'有神秘劍客暗中替你擋下幽冥樓追兵。':w.decision==='question'?'洛陽出現與「聽雨閣」有關的密探。':'青石鎮官牢附近出現可疑黑衣人。')}
if(e==='captured'&&S.day>=w.rescueDay+3&&!w.jailRaid){w.jailRaid=true;addRumor('幽冥樓試圖劫走關押在青石鎮的刺客。')}
}
function tick(h=1){ensureWorld();for(let i=0;i<h;i++){legacy_tick(1);processWorldHour()}S.world.lastProcessed=S.day*24+S.hour}
function render(){if(S){ensureWorld();}legacy_render();if(!S)return;const tabs=$('tabs');tabs.insertAdjacentHTML('beforeend',`<button class="${tab==='活江湖'?'active':''}" onclick="changeTab('活江湖')">活江湖</button>`);if(tab==='活江湖'){$('scene').innerHTML=viewLivingWorld();if(S.world.events.bamboo==='choice')$('scene').insertAdjacentHTML('afterbegin',choicePanel());}}

// v0.5 多目標效用 AI：規則可重現、每小時更新、存檔保留狀態。
const AI_GOALS={
 su:[{id:'heal',label:'行醫救人',place:'town',action:'在回春堂替病患診治',weights:{duty:2,care:3},hours:[7,12]},{id:'herbs',label:'採集藥草',place:'forest',action:'尋找療傷藥材',weights:{supplies:3,care:1},hours:[11,18]},{id:'research',label:'調查身世',place:'town',action:'查閱父親遺留的醫書',weights:{truth:3,energy:1},hours:[18,24]},{id:'rest',label:'休養',place:'town',action:'閉門休養，恢復精神',weights:{fatigue:4},hours:[0,24]}],
 gu:[{id:'train',label:'練劍',place:'mountain',action:'在蒼嵐山門練習劍法',weights:{mastery:3,energy:1},hours:[6,17]},{id:'investigate',label:'追查仇敵',place:'luoyang',action:'在洛陽查訪師門舊案',weights:{truth:3,duty:1},hours:[8,22]},{id:'aid',label:'援助友人',place:'town',action:'前往青石鎮打聽故人安危',weights:{care:3,duty:1},hours:[8,20]},{id:'rest',label:'歇息',place:'luoyang',action:'在客棧歇息',weights:{fatigue:4},hours:[0,24]}],
 ye:[{id:'mission',label:'執行密令',place:'forest',action:'潛行追查幽冥樓密令',weights:{duty:3,truth:1},hours:[10,22]},{id:'hide',label:'藏匿',place:'valley',action:'隱蔽行蹤，避開追兵',weights:{danger:4,fatigue:1},hours:[0,24]},{id:'escape',label:'尋求自由',place:'luoyang',action:'暗中尋找脫離幽冥樓的門路',weights:{freedom:4,truth:1},hours:[17,24]},{id:'rest',label:'調息',place:'valley',action:'運功調息',weights:{fatigue:4},hours:[0,24]}]
};
const AI_BASE={su:{duty:52,care:72,supplies:55,truth:36,energy:65,fatigue:20},gu:{mastery:64,truth:56,duty:40,care:32,energy:70,fatigue:15},ye:{duty:65,truth:35,danger:38,freedom:48,fatigue:25}};
function ensureAI(){ensureWorld();if(!S.world.ai||typeof S.world.ai!=='object')S.world.ai={};for(const id of Object.keys(AI_GOALS)){if(!S.world.ai[id])S.world.ai[id]={needs:{...AI_BASE[id]},goal:null,until:0,history:[],lastHour:-1};const a=S.world.ai[id];if(!a.needs)a.needs={...AI_BASE[id]};if(!Array.isArray(a.history))a.history=[];}}
function aiAbsoluteHour(){return (S.day-1)*24+S.hour;}
function aiLocked(id){const e=S.world.events.bamboo;if(id==='su'&&e==='battle')return true;if(id==='ye'&&['battle','captured'].includes(e))return true;if(id==='su'&&e==='injured'&&S.day<=S.world.injuryUntil)return true;if(id==='su'&&e==='rescued'&&S.day<=S.world.rescueDay+1)return true;return false;}
function aiUtility(id,g,a){let score=0;for(const [k,w] of Object.entries(g.weights))score+=(a.needs[k]||0)*w;const hour=S.hour;if(hour<g.hours[0]||hour>=g.hours[1])score-=160;const e=S.world.events.bamboo;if(id==='su'&&e==='injured'&&g.id==='rest')score+=180;if(id==='gu'&&e==='captured'&&g.id==='aid')score+=110;if(id==='ye'&&e==='rescued'&&S.world.decision==='mercy'&&g.id==='escape')score+=120;if(id==='ye'&&S.world.decision==='capture'&&g.id==='hide')score+=100;if(a.goal===g.id)score+=24;return Math.round(score);}
function updateAIHour(){ensureAI();const now=aiAbsoluteHour();for(const id of Object.keys(AI_GOALS)){const a=S.world.ai[id];if(a.lastHour===now)continue;a.lastHour=now;const n=a.needs;n.fatigue=Math.min(100,(n.fatigue||0)+6);if(n.energy!==undefined)n.energy=Math.max(0,n.energy-5);if(n.supplies!==undefined)n.supplies=Math.min(100,n.supplies+3);if(n.danger!==undefined)n.danger=Math.min(100,n.danger+2);if(aiLocked(id)){a.goal=null;continue;}const ranked=AI_GOALS[id].map(g=>({g,score:aiUtility(id,g,a)})).sort((x,y)=>y.score-x.score||x.g.id.localeCompare(y.g.id));let pick=ranked[0];if(a.goal&&now<a.until){const current=ranked.find(x=>x.g.id===a.goal);if(current&&current.score>=pick.score-60)pick=current;}if(a.goal!==pick.g.id){a.goal=pick.g.id;a.until=now+3;a.history.unshift({day:S.day,hour:S.hour,text:pick.g.label});a.history=a.history.slice(0,12);if(id==='su'&&pick.g.id==='herbs'&&S.world.events.bamboo==='pending'&&S.flags.letter)addRumor('回春堂醫女近日常往竹影林採藥。');if(id==='ye'&&pick.g.id==='escape'&&S.world.decision==='mercy')addRumor('有人在洛陽看見一名黑衣女子打聽離開幽冥樓的方法。');}
 if(pick.g.id==='rest'||pick.g.id==='hide'){n.fatigue=Math.max(0,n.fatigue-22);if(n.energy!==undefined)n.energy=Math.min(100,n.energy+18);if(n.danger!==undefined)n.danger=Math.max(0,n.danger-10);}if(pick.g.id==='herbs')n.supplies=Math.max(0,n.supplies-24);if(pick.g.id==='heal')n.care=Math.max(0,n.care-6);if(pick.g.id==='investigate'||pick.g.id==='research')n.truth=Math.max(0,n.truth-5);if(pick.g.id==='train')n.mastery=Math.max(0,n.mastery-5);if(pick.g.id==='mission')n.duty=Math.max(0,n.duty-6);if(pick.g.id==='escape')n.freedom=Math.max(0,n.freedom-7);
}}
const v04_npcNow=npcNow;
npcNow=function(id){const original=v04_npcNow(id);if(!S||!AI_GOALS[id])return original;ensureAI();if(aiLocked(id))return original;const a=S.world.ai[id];const goal=AI_GOALS[id].find(x=>x.id===a.goal);return goal?{place:goal.place,action:goal.action}:original;};
const v04_tick=tick;
tick=function(h=1){for(let i=0;i<h;i++){v04_tick(1);updateAIHour();}};
const v04_render=render;
render=function(){if(S){ensureAI();if(Object.values(S.world.ai).every(x=>x.lastHour<0))updateAIHour();}v04_render();if(!S)return;$('tabs').insertAdjacentHTML('beforeend',`<button class="${tab==='自主決策'?'active':''}" onclick="changeTab('自主決策')">自主決策</button>`);if(tab==='自主決策')$('scene').innerHTML=viewAI();};
function viewAI(){ensureAI();return `<h2>NPC 多目標自主決策</h2><p class="small muted">每個遊戲小時，NPC 依需求、時間、任務與危險程度評估目標；特殊事件優先於日常決策。決策紀錄會隨存檔保存。</p><div class="actions">${btn('等候 1 時','waitHours(1)')}${btn('等候 3 時','waitHours(3)')}${btn('等候 6 時','waitHours(6)')}</div><div class="grid">${Object.entries(AI_GOALS).map(([id,goals])=>{const a=S.world.ai[id],at=npcNow(id),locked=aiLocked(id),rank=goals.map(g=>({g,score:aiUtility(id,g,a)})).sort((x,y)=>y.score-x.score);return `<div class="tile"><h3>${NPC_DB[id].name}</h3><p class="small"><b>${locked?'特殊事件接管':(goals.find(g=>g.id===a.goal)||{}).label||'觀察中'}</b></p><p class="small">所在地：${places[at.place].name}<br>行動：${safe(at.action)}</p><p class="small muted">${Object.entries(a.needs).map(([k,v])=>`${({duty:'責任',care:'關懷',supplies:'藥材需求',truth:'求真',energy:'精力',fatigue:'疲勞',mastery:'精進',danger:'危險',freedom:'自由'}[k]||k)} ${Math.round(v)}`).join(' · ')}</p><details><summary>查看目標評分與決策紀錄</summary>${rank.map(x=>`<p class="small">${x.g.label}：${x.score} 分</p>`).join('')}<hr>${a.history.map(x=>`<p class="small">第${x.day}日 ${String(x.hour).padStart(2,'0')}:00 · ${x.text}</p>`).join('')||'<p class="small">尚無紀錄</p>'}</details></div>`}).join('')}</div><p class="small muted">本版本為離線規則式 AI，非線上語言模型；不會產生未經設計的劇情或無限制自由對話。</p>`;}

// v0.6 社交網絡：關係為雙向獨立值，事件冷卻、記憶、傳聞皆隨存檔保留。
const SOCIAL_PAIRS=[['su','gu'],['su','ye'],['gu','ye']];
const SOCIAL_NAMES={su:'蘇晚晴',gu:'顧長風',ye:'夜無霜'};
const SOCIAL_TEMPLATES={
 'su:gu':[
  {id:'herbal_aid',title:'俠客護藥',place:'town',text:'顧長風替蘇晚晴護送一批藥材，兩人談起江湖救人之道。',a:8,b:7,trust:6,requires:()=>true},
  {id:'old_case',title:'舊案交換',place:'town',text:'蘇晚晴拿出父親留下的舊藥方，顧長風發現上面有師門印記。',a:5,b:6,trust:8,requires:()=>S.world.social.relations['su:gu'].trust>=18}
 ],
 'su:ye':[
  {id:'wounded_stranger',title:'夜雨救治',place:'town',text:'蘇晚晴為一名蒙面女子包紮傷口，卻在她袖口看見幽冥樓暗紋。',a:5,b:4,trust:4,requires:()=>S.world.events.bamboo!=='captured'},
  {id:'secret_confession',title:'藥鋪密談',place:'town',text:'夜無霜向蘇晚晴透露幽冥樓內部消息，兩人決定暫時保守秘密。',a:9,b:8,trust:9,requires:()=>S.world.social.relations['su:ye'].trust>=12&&S.world.decision==='mercy'}
 ],
 'gu:ye':[
  {id:'crossed_swords',title:'古道交鋒',place:'luoyang',text:'顧長風追查師門線索時與夜無霜交手，雙方認出彼此的劍招。',a:-8,b:-7,trust:-5,requires:()=>true},
  {id:'uneasy_truce',title:'暫息干戈',place:'luoyang',text:'顧長風與夜無霜為追查共同敵人暫時停戰，彼此仍心存戒備。',a:7,b:7,trust:7,requires:()=>S.world.social.relations['gu:ye'].trust>=-10&&S.world.decision==='mercy'}
 ]
};
function ensureSocial(){if(!S)return;ensureAI();let w=S.world;if(!w.social||typeof w.social!=='object')w.social={relations:{},events:[],cooldowns:{},lastHour:-1,seen:{}};let z=w.social;z.relations??={};z.events??=[];z.cooldowns??={};z.seen??={};if(!Number.isFinite(z.lastHour))z.lastHour=-1;for(const [a,b] of SOCIAL_PAIRS){let key=a+':'+b;if(!z.relations[key])z.relations[key]={a:0,b:0,trust:0};}}
function socialClamp(n){return Math.max(-100,Math.min(100,n));}
function socialShift(key,da,db,dt){let r=S.world.social.relations[key];r.a=socialClamp(r.a+da);r.b=socialClamp(r.b+db);r.trust=socialClamp(r.trust+dt);}
function socialLog(key,event){let z=S.world.social;z.events.unshift({day:S.day,hour:S.hour,key,title:event.title,text:event.text});z.events=z.events.slice(0,60);z.seen[event.id]=true;z.cooldowns[key]=aiAbsoluteHour()+12;addRumor(event.text);for(const id of key.split(':')){S.npcs[id].notes.push(event.title);S.npcs[id].notes=S.npcs[id].notes.slice(-8);}}
function socialHour(){ensureSocial();const z=S.world.social,now=aiAbsoluteHour();if(z.lastHour===now)return;z.lastHour=now;if(S.hour<7||S.hour>=23)return;
 // 每三個遊戲小時進行一次社交檢查；只有同地點的兩人能互動。
 if(now%3!==0)return;
 for(const [a,b] of SOCIAL_PAIRS){const key=a+':'+b;if(now<(z.cooldowns[key]||0))continue;if(aiLocked(a)||aiLocked(b))continue;let la=npcNow(a),lb=npcNow(b);if(!la||!lb||la.place!==lb.place)continue;
 const options=SOCIAL_TEMPLATES[key].filter(t=>!z.seen[t.id]&&t.requires());if(!options.length)continue;
 const event=options[0];socialShift(key,event.a,event.b,event.trust);socialLog(key,event);
 }}

tick=function(h=1){for(let i=0;i<h;i++){v05_tick(1);socialHour();}};

// v0.7 長期關係：互信、情義、恩怨、承諾及人物記憶皆保存於 S.world.bonds。
const BOND_LABEL={su:'蘇晚晴',gu:'顧長風',ye:'夜無霜'};
function bondEnsure(){if(!S)return;ensureSocial();let w=S.world;w.bonds??={people:{},pairs:{},history:[],seen:{},lastDay:0};let b=w.bonds;b.people??={};b.pairs??={};b.history??=[];b.seen??={};for(const id of ['su','gu','ye'])b.people[id]??={trust:0,affection:0,respect:0,grudge:0,promise:false,memories:[]};for(const [a,c] of SOCIAL_PAIRS)b.pairs[a+':'+c]??={bond:'未定',history:[]};if(!Number.isFinite(b.lastDay))b.lastDay=0;}
function bondClamp(v){return Math.max(0,Math.min(100,v));}
function bondMemory(id,detail){const p=S.world.bonds.people[id];p.memories.unshift(`第${S.day}日：${detail}`);p.memories=p.memories.slice(0,12);}
function bondRecord(title,detail){let b=S.world.bonds;b.history.unshift({day:S.day,hour:S.hour,title,detail});b.history=b.history.slice(0,60);writeLog(title+'：'+detail);if(typeof addRumor==='function')addRumor(detail);}

function bondStatus(p){if(p.grudge>=65)return '宿怨難解';if(p.trust>=65&&p.affection>=65&&p.grudge<25)return '情誼深厚';if(p.trust>=60&&p.respect>=60)return '生死之交';if(p.trust>=35)return '漸生信任';if(p.grudge>=30)return '心存芥蒂';return '萍水相逢';}
function bondPairStatus(key){const r=S.world.social.relations[key];if(r.trust<=-45)return '世仇';if(r.trust<=-15)return '對立';if(r.trust>=50&&r.a>=30&&r.b>=30)return '知己';if(r.trust>=20)return '盟友';return '江湖相識';}
function bondSyncSocial(){bondEnsure();const b=S.world.bonds;for(const [a,c] of SOCIAL_PAIRS){let key=a+':'+c;let status=bondPairStatus(key);let pair=b.pairs[key];if(pair.bond!==status){if(pair.bond!=='未定')bondRecord('江湖關係轉變',`${BOND_LABEL[a]}與${BOND_LABEL[c]}的關係變為「${status}」。`);pair.bond=status;pair.history.unshift(`第${S.day}日：${status}`);pair.history=pair.history.slice(0,10);}}}
function bondDaily(){bondEnsure();const b=S.world.bonds;if(b.lastDay>=S.day)return;for(let d=b.lastDay+1;d<=S.day;d++){for(const id of ['su','gu','ye']){let p=b.people[id];if(p.grudge>0&&d%3===0)p.grudge--;if(p.affection>0&&p.trust<20&&d%5===0)p.affection--;}}b.lastDay=S.day;}
function bondMilestones(){bondEnsure();const b=S.world.bonds;const tasks=[
{id:'su_healer',when:()=>b.people.su.trust>=35&&b.people.su.respect>=25,title:'青囊相託',text:'蘇晚晴將父親的手札託付你保管，請你代查醫書的來歷。',person:'su'},
{id:'gu_brother',when:()=>b.people.gu.trust>=55&&b.people.gu.respect>=45,title:'酒盞結義',text:'顧長風邀你共飲，約定日後有難彼此相助。',person:'gu'},
{id:'ye_rebel',when:()=>b.people.ye.trust>=50&&b.people.ye.grudge<30&&S.world.decision==='mercy',title:'暗夜歸心',text:'夜無霜決意不再替幽冥樓殺害無辜，暗中送來密令殘頁。',person:'ye'},
{id:'ye_enemy',when:()=>b.people.ye.grudge>=65,title:'霜刃宿怨',text:'夜無霜將你視為必須清算的仇敵，幽冥樓耳目開始追查你的行蹤。',person:'ye'}
];for(const t of tasks){if(!b.seen[t.id]&&t.when()){b.seen[t.id]=true;bondMemory(t.person,t.title);bondRecord(t.title,t.text);}}}

function bondAction(id,type){bondEnsure();const p=S.world.bonds.people[id];const at=npcNow(id);if(!at||at.place!==S.place){writeLog('此人目前不在此地，無法當面互動。');render();return;}if(type==='talk'){bondChange(id,{trust:5,affection:3},'你與'+BOND_LABEL[id]+'促膝長談，分享江湖見聞。');tick(1);}else if(type==='help'){if(S.silver<15){writeLog('需要 15 兩銀子才能提供實際幫助。');render();return;}S.silver-=15;bondChange(id,{trust:8,respect:6,affection:3},'你花費十五兩相助，對方記下這份情義。');tick(2);}else if(type==='insult'){bondChange(id,{trust:-12,affection:-8,grudge:18},'你出言羞辱，雙方結下芥蒂。');tick(1);}else if(type==='apologize'){if(p.grudge<5){writeLog('眼下並無需要化解的恩怨。');render();return;}bondChange(id,{grudge:-12,trust:3},'你當面致歉，對方暫且收起怒意。');tick(1);}else if(type==='promise'){if(p.trust<35){writeLog('交情未深，對方不願輕許承諾。');render();return;}if(p.promise){writeLog('你們已有約定。');render();return;}p.promise=true;bondMemory(id,'你許下相助之諾');bondRecord('江湖之約','你與'+BOND_LABEL[id]+'約定危難之際互相照應。');tick(1);}bondObserveWorld();auto();render();}

const DESTINY_NAMES={su:'蘇晚晴',gu:'顧長風',ye:'夜無霜'};
function destinyEnsure(){if(!S)return;bondEnsure();let w=S.world;w.destiny??={people:{},events:[],pending:[],seen:{},lastDay:S.day};let d=w.destiny;d.people??={};d.events??=[];d.pending??=[];d.seen??={};d.lastDay??=S.day;for(const id of Object.keys(DESTINY_NAMES))d.people[id]??={path:'未定',sect:id==='ye'?'幽冥樓':id==='gu'?'流浪劍客':'回春堂',status:'平安',pledge:'無',companion:false};return d;}

 // 玩家與 NPC 的羈絆會影響可供選擇的命運，但不強制玩家選邊。
 if(b.su.grudge>=70&&d.people.su.path==='未定'&&!d.seen.su_estranged){d.seen.su_estranged=true;d.people.su.path='疏遠';destinyNote('回春堂閉門','蘇晚晴不願再向你透露蘇家秘密。');}
 if(b.gu.grudge>=70&&d.people.gu.path==='未定'&&!d.seen.gu_estranged){d.seen.gu_estranged=true;d.people.gu.path='對立';destinyNote('劍客斷交','顧長風與你割袍斷義，獨自追查師門舊案。');}
 if(b.ye.grudge>=70&&d.people.ye.path==='未定'&&!d.seen.ye_estranged){d.seen.ye_estranged=true;d.people.ye.path='復仇';destinyQueue('ye_vengeance',2,'霜刃追蹤','夜無霜在江湖放出追查你的消息。','vengeance');}
 let due=d.pending.filter(x=>x.day<=S.day);d.pending=d.pending.filter(x=>x.day>S.day);for(const e of due){if(e.fn==='healer'){d.people.su.status='行醫濟世';S.repute+=5;}if(e.fn==='brother'){d.people.gu.companion=true;S.repute+=5;}if(e.fn==='rebel'){d.people.ye.sect='無門無派';d.people.ye.status='遭幽冥樓追捕';}if(e.fn==='vengeance'){d.people.ye.status='追查玩家';}destinyNote(e.title,e.detail);}
}

function lifeEnsure(){if(!S)return null;destinyEnsure();const w=S.world;w.life??={people:{},factions:{},events:[],lastDay:S.day,seen:{},companion:null};const l=w.life;l.people??={};l.factions??={};l.events??=[];l.seen??={};l.lastDay??=S.day;for(const [id,m] of Object.entries(FACTION_META))l.factions[id]??={power:m.base,influence:0};for(const id of ['su','gu','ye'])l.people[id]??={place:null,stage:'平常生活',travelDay:0};return l;}
function lifeNote(title,detail){let l=lifeEnsure();l.events.unshift({day:S.day,title,detail});l.events=l.events.slice(0,60);writeLog(title+'：'+detail);if(typeof addRumor==='function')addRumor(detail);}
function lifeAdjust(id,amount){const f=lifeEnsure().factions[id];f.power=Math.max(0,Math.min(100,f.power+amount));f.influence+=amount;}
function lifeDaily(){let l=lifeEnsure();if(l.lastDay>=S.day)return;for(let day=l.lastDay+1;day<=S.day;day++){
 for(const id of ['su','gu','ye']){const p=S.world.destiny.people[id],r=LIFE_ROUTES[id][p.path],person=l.people[id];if(!r)continue;let index=Math.floor((day-1)/2)%r.length;let dest=r[index];if(person.place!==dest){person.place=dest;person.travelDay=day;person.stage=p.path==='叛逃'?'躲避追兵':p.path==='尋親'?'追尋蘇家往事':p.path==='復仇'?'追查仇敵':p.path==='行醫'?'巡診濟世':'遊歷江湖';if(day%2===1)lifeNote('人物行旅',`${DESTINY_NAMES[id]}前往${places[dest].name}，${person.stage}。`);}}
 if(day%3===0){lifeAdjust('cang',1);lifeAdjust('you',S.world.destiny.people.ye.path==='叛逃'?-3:1);lifeAdjust('folk',S.world.destiny.people.su.path==='行醫'?3:1);}
 if(S.world.destiny.people.ye.path==='叛逃'&&day%4===0){lifeAdjust('you',-2);lifeAdjust('court',1);lifeNote('幽冥追捕','幽冥樓追捕叛逃刺客，附近城鎮戒備森嚴。');}
 if(S.world.destiny.people.su.path==='行醫'&&day%5===0){lifeAdjust('folk',3);lifeNote('杏林佳話','蘇晚晴沿途救治百姓，民間聲望逐漸提升。');}
 if(S.world.destiny.people.gu.path==='復仇'&&day%6===0){lifeAdjust('cang',-1);lifeNote('劍影風波','顧長風追查舊案，蒼嵐派內流言四起。');}
 }l.lastDay=S.day;}
const lifePrevNpcNow=npcNow;
npcNow=function(id){let base=lifePrevNpcNow(id);if(!S)return base;let l=lifeEnsure(),p=S.world.destiny.people[id];if(l.companion===id)return {place:S.place,action:'隨玩家同行，護衛旅途'};if(id==='ye'&&S.world.events.bamboo==='captured')return base;if(id==='su'&&S.world.events.bamboo==='battle')return base;if(id==='ye'&&S.world.events.bamboo==='battle')return base;let trip=l.people[id];if(trip&&trip.place&&p.path!=='未定')return {place:trip.place,action:trip.stage};return base;};
const lifePrevTick=tick;
tick=function(h=1){for(let i=0;i<h;i++){lifePrevTick(1);lifeDaily();}};
function lifeCompanion(id){let l=lifeEnsure(),p=S.world.destiny.people[id],b=S.world.bonds.people[id];if(l.companion===id){l.companion=null;lifeNote('暫別同行',`${DESTINY_NAMES[id]}與你約定日後再會。`);}else{if(l.companion){writeLog('隊伍已有一位同行夥伴，請先讓其離隊。');render();return;}if(!npcHere(id)||b.trust<50||(id==='gu'&&!p.companion)||(id==='ye'&&p.path!=='叛逃')){writeLog('目前尚未達到同行條件，或人物不在身旁。');render();return;}l.companion=id;lifeNote('俠客同行',`${DESTINY_NAMES[id]}決定暫時與你結伴遊歷。`);}auto();render();}
function lifeFactionAction(type){const l=lifeEnsure();if(type==='help'){if(S.silver<20){writeLog('需要二十兩銀子。');render();return;}S.silver-=20;lifeAdjust('folk',3);S.repute+=2;lifeNote('賑濟鄉民','你捐出二十兩救助百姓，民望提升。');}else if(type==='patrol'){tick(3);lifeAdjust('court',2);lifeAdjust('you',-1);gainXP(8);lifeNote('協助巡防','你協助官府巡防，幽冥樓活動略受壓制。');}else if(type==='sect'){if(S.place!=='mountain'){writeLog('須前往蒼嵐山門才能協助門派。');render();return;}tick(3);lifeAdjust('cang',3);gainXP(8);lifeNote('山門支援','你協助蒼嵐派整理防務，門派實力提升。');}auto();render();}
function lifeView(){const l=lifeEnsure(),d=S.world.destiny;return `<h2>人生行旅 · 江湖勢力演化</h2><p class="small muted">NPC 依已選命運每兩日轉換行旅地點；勢力每三日更新，部分重大事件額外改變勢力。同行夥伴跟隨玩家移動（尚未提供隊友戰鬥 AI）。</p><div class="actions">${btn('等候 24 時','waitHours(24)')}${btn('等候 3 日','waitHours(72)')}</div><h3>人物人生與旅途</h3><div class="grid">${['su','gu','ye'].map(id=>{let n=npcNow(id),p=d.people[id],b=S.world.bonds.people[id];let eligible=n.place===S.place&&b.trust>=50&&(id==='gu'?p.companion:id==='ye'?p.path==='叛逃':true);return `<div class="tile"><h3>${DESTINY_NAMES[id]} <span class="badge">${safe(p.path)}</span></h3><p class="small">所在地：${safe(places[n.place]?.name||'行蹤不明')}<br>近況：${safe(n.action)}<br>身份：${safe(p.sect)}</p><p class="small muted">信任 ${b.trust} · 階段：${safe(l.people[id].stage)}</p>${btn(l.companion===id?'暫時離隊':'邀請同行',`lifeCompanion('${id}')`,'',l.companion!==id&&!eligible)}</div>`}).join('')}</div><h3>江湖勢力</h3><div class="grid">${Object.entries(FACTION_META).map(([id,m])=>{let f=l.factions[id];return `<div class="tile"><b>${m.name}</b><p class="small">勢力強度 ${f.power}/100 · 累積變化 ${f.influence>=0?'+':''}${f.influence}</p><div class="bar"><i style="width:${f.power}%"></i></div></div>`}).join('')}</div><h3>玩家可採取的行動</h3><div class="actions">${btn('賑濟鄉民（20兩）',"lifeFactionAction('help')",'',S.silver<20)}${btn('協助官府巡防（3時）',"lifeFactionAction('patrol')")}${btn('支援蒼嵐山門（3時）',"lifeFactionAction('sect')",'',S.place!=='mountain')}</div><h3>江湖演化紀事</h3>${l.events.slice(0,25).map(e=>`<div class="event-chip"><b>${safe(e.title)}</b><span class="small muted"> · 第${e.day}日</span><p>${safe(e.detail)}</p></div>`).join('')||'<p class="small muted">尚無行旅紀錄。選擇人物命運並推進時間後將逐步產生。</p>'}`;}
const lifePrevRender=render;
render=function(){if(S)lifeEnsure();lifePrevRender();if(!S)return;$('tabs').insertAdjacentHTML('beforeend',`<button class="${tab==='江湖勢力'?'active':''}" onclick="changeTab('江湖勢力')">江湖勢力</button>`);if(tab==='江湖勢力')$('scene').innerHTML=lifeView();};
const lifePrevContinue=continueGame;
continueGame=function(){lifePrevContinue();if(S){lifeEnsure();lifeDaily();render();}};
const lifePrevNew=newGame;
newGame=function(){lifePrevNew();lifeEnsure();auto();};


/* v1.0: integrated companion AI, territory warfare, and NPC economy. */
const V10_GOODS={'乾糧':{base:9,prod:'town'},'金瘡藥':{base:22,prod:'town'},'藥材':{base:13,prod:'forest'},'鐵礦':{base:17,prod:'mountain'},'絲綢':{base:28,prod:'luoyang'}};
const V10_TERRITORIES={town:{name:'青石鎮',owner:'folk',value:3},forest:{name:'竹影林',owner:'you',value:2},valley:{name:'斷雲谷',owner:'you',value:2},luoyang:{name:'洛陽城',owner:'court',value:4},mountain:{name:'蒼嵐山門',owner:'cang',value:3}};
const V10_NPCS={town:'錢掌櫃',forest:'採藥客',valley:'山谷行商',luoyang:'沈記商號',mountain:'鑄劍師'};
function v10Ensure(){if(!S)return null;let l=lifeEnsure();l.sim??={lastDay:S.day,markets:{},territories:{},wars:[],history:[],caravans:[],companion:{},counter:0};let x=l.sim;x.markets??={};x.territories??={};x.wars??=[];x.history??=[];x.caravans??=[];x.companion??={};x.counter??=0;x.lastDay??=S.day;for(let [id,t] of Object.entries(V10_TERRITORIES)){x.territories[id]??={owner:t.owner,fort:25,unrest:0};x.markets[id]??={stock:{},demand:{}};for(let g of Object.keys(V10_GOODS)){x.markets[id].stock[g]??=(V10_GOODS[g].prod===id?18:8);x.markets[id].demand[g]??=8;}}for(let id of ['su','gu','ye'])x.companion[id]??={hp: id==='gu'?105:80,maxHp:id==='gu'?105:80,mp:50,maxMp:50};return x;}
function v10Log(title,detail){const x=v10Ensure();x.history.unshift({day:S.day,title,detail});x.history=x.history.slice(0,90);writeLog(title+'：'+detail);}
function v10Price(place,good){const x=v10Ensure(),m=x.markets[place],base=V10_GOODS[good].base,owner=x.territories[place].owner,war=x.wars.some(w=>w.active&&(w.target===place||w.attacker===owner||w.defender===owner));return Math.max(2,Math.round(base*(1+(m.demand[good]-m.stock[good])/35)*(war?1.3:1)));}
function v10Daily(){const x=v10Ensure();if(x.lastDay>=S.day)return;for(let day=x.lastDay+1;day<=S.day;day++){for(let [place,m] of Object.entries(x.markets)){for(let [good,meta] of Object.entries(V10_GOODS)){let production=meta.prod===place?5:1;let war=x.wars.some(w=>w.active&&w.target===place);m.stock[good]=Math.min(90,Math.max(0,m.stock[good]+production-(war?4:2)));m.demand[good]=Math.min(25,Math.max(4,m.demand[good]+(war?2:0)-(day%3===0?1:0)));}}for(let w of x.wars.filter(w=>w.active)){v10WarRound(w,true);}if(day%3===0){const source=['town','luoyang','mountain'][Math.floor(day/3)%3],target=source==='town'?'luoyang':source==='luoyang'?'mountain':'town',g=Object.keys(V10_GOODS).find(g=>V10_GOODS[g].prod===source)||'乾糧';let cargo=Math.min(5,x.markets[source].stock[g]);x.markets[source].stock[g]-=cargo;let raided=x.wars.some(w=>w.active&&(w.target===source||w.target===target));if(!raided){x.markets[target].stock[g]+=cargo;v10Log('商隊抵達',`${V10_NPCS[source]}運送${g} ${cargo} 件至${places[target].name}。`);}else{v10Log('商路受阻',`${places[source].name}至${places[target].name}的商隊因戰亂損失${g} ${cargo} 件。`);}}}x.lastDay=S.day;}
const v10OldTick=tick;tick=function(h=1){v10OldTick(h);v10Daily();};
function v10Trade(g,kind,qty){const x=v10Ensure(),m=x.markets[S.place];qty=Number(qty);if(!V10_GOODS[g]||![1,5].includes(qty)||!['buy','sell'].includes(kind)||battle)return;let price=v10Price(S.place,g),cost=price*qty;if(kind==='buy'){if(m.stock[g]<qty||S.silver<cost){writeLog('庫存或銀兩不足。');render();return;}m.stock[g]-=qty;S.silver-=cost;S.items[g]=(S.items[g]||0)+qty;m.demand[g]=Math.min(25,m.demand[g]+qty);}else{if((S.items[g]||0)<qty){writeLog('行囊貨物不足。');render();return;}S.items[g]-=qty;m.stock[g]+=qty;S.silver+=Math.floor(cost*.75);m.demand[g]=Math.max(4,m.demand[g]-qty);}v10Log('商貿往來',`${kind==='buy'?'向':'售予'}${V10_NPCS[S.place]}${kind==='buy'?'買入':'售出'}${g} ${qty} 件。`);tick(1);auto();render();}
function v10Economy(){const x=v10Ensure(),m=x.markets[S.place];return `<h2>江湖商貿 · NPC 經濟</h2><p>目前商人：${V10_NPCS[S.place]}｜你持有 ${S.silver} 兩。各地供需、戰事與商隊會影響物價。</p><div class="actions">${btn('等候一日','waitHours(24)')}</div><div class="grid">${Object.keys(V10_GOODS).map(g=>`<div class="tile"><h3>${g}</h3><p class="small">單價：${v10Price(S.place,g)} 兩<br>商人庫存：${m.stock[g]}<br>你的行囊：${S.items[g]||0}<br>需求指數：${m.demand[g]}</p><div class="actions">${btn('買 1',`v10Trade('${g}','buy',1)`,'',m.stock[g]<1||S.silver<v10Price(S.place,g))}${btn('買 5',`v10Trade('${g}','buy',5)`,'',m.stock[g]<5||S.silver<v10Price(S.place,g)*5)}${btn('賣 1',`v10Trade('${g}','sell',1)`,'',(S.items[g]||0)<1)}${btn('賣 5',`v10Trade('${g}','sell',5)`,'',(S.items[g]||0)<5)}</div></div>`).join('')}</div><p class="small muted">收購價為標價的 75%；每次交易推進一小時。商隊每三日流通物資，戰爭會阻斷部分商路。</p>`;}
function v10Declare(attacker,target){const x=v10Ensure(),t=x.territories[target];if(!FACTION_META[attacker]||!t||t.owner===attacker||x.wars.some(w=>w.active&&w.target===target)||x.wars.filter(w=>w.active).length>=2)return;const defender=t.owner;const w={id:++x.counter,attacker,defender,target,attack:Math.max(12,Math.round(lifeEnsure().factions[attacker].power*.55)),defense:Math.max(12,Math.round(lifeEnsure().factions[defender].power*.48+t.fort*.4)),active:true,round:0};x.wars.push(w);v10Log('門派宣戰',`${FACTION_META[attacker].name}向${FACTION_META[defender].name}宣戰，爭奪${places[target].name}。`);auto();render();}
function v10WarRound(w,passive=false){if(!w.active)return;w.round++;let a=Math.max(1,Math.floor(w.attack*.17)+rand(0,5)),d=Math.max(1,Math.floor(w.defense*.15)+rand(0,5));w.attack=Math.max(0,w.attack-d);w.defense=Math.max(0,w.defense-a);let x=v10Ensure();x.markets[w.target].stock['乾糧']=Math.max(0,x.markets[w.target].stock['乾糧']-2);if(w.attack===0||w.defense===0||w.round>=8){let winner=w.defense===0&&w.attack>0?w.attacker:w.attack===0&&w.defense>0?w.defender:w.attack>w.defense?w.attacker:w.defender;w.active=false;if(winner===w.attacker){x.territories[w.target].owner=winner;lifeAdjust(winner,4);lifeAdjust(w.defender,-5);}else{lifeAdjust(w.defender,2);lifeAdjust(w.attacker,-4);}x.territories[w.target].fort=12;v10Log('戰事終結',`${places[w.target].name}之戰結束，${FACTION_META[winner].name}控制此地。`);}else if(w.round%2===0)v10Log('戰事進展',`${places[w.target].name}攻方兵力 ${w.attack}、守方兵力 ${w.defense}。`);}
function v10JoinWar(id,side){const x=v10Ensure(),w=x.wars.find(w=>w.id===id&&w.active);if(!w||battle)return;if(S.hp<20){writeLog('氣血不足，無法參戰。');render();return;}let faction=side==='attack'?w.attacker:w.defender;if(S.silver<10){writeLog('出征需備妥十兩軍需。');render();return;}S.silver-=10;S.hp=Math.max(1,S.hp-8);let bonus=12+S.level*3+(x.companion&&lifeEnsure().companion?7:0);if(side==='attack')w.defense=Math.max(0,w.defense-bonus);else w.attack=Math.max(0,w.attack-bonus);lifeAdjust(faction,1);gainXP(12);v10Log('俠客參戰',`你協助${FACTION_META[faction].name}，造成 ${bonus} 點戰場壓力。`);tick(6);if(w.active)v10WarRound(w);auto();render();}
function v10Wars(){const x=v10Ensure(),active=x.wars.filter(w=>w.active);return `<h2>門派戰爭 · 領地爭奪</h2><p class="small muted">勢力會消耗兵力攻城守地；勝利會更換領地控制者，並影響市場與商路。玩家可介入，但不會自動指揮整個門派。</p><div class="actions">${btn('等候一日','waitHours(24)')}${btn('等候三日','waitHours(72)')}</div><h3>領地歸屬</h3><div class="grid">${Object.entries(x.territories).map(([id,t])=>`<div class="tile"><h3>${places[id].name}</h3><p>控制：${FACTION_META[t.owner].name}</p><p class="small">城防 ${t.fort}</p><div class="actions">${Object.keys(FACTION_META).filter(f=>f!==t.owner).map(f=>btn(`${FACTION_META[f].name}出兵`,`v10Declare('${f}','${id}')`,'',active.some(w=>w.target===id)||active.length>=2)).join('')}</div></div>`).join('')}</div><h3>進行中的戰事</h3>${active.map(w=>`<div class="tile"><h3>${places[w.target].name} · 第${w.round}回合</h3><p>${FACTION_META[w.attacker].name}（${w.attack}）攻打 ${FACTION_META[w.defender].name}（${w.defense}）</p><div class="actions">${btn('支援攻方（10兩）',`v10JoinWar(${w.id},'attack')`,'',S.silver<10||S.hp<20)}${btn('支援守方（10兩）',`v10JoinWar(${w.id},'defend')`,'',S.silver<10||S.hp<20)}</div></div>`).join('')||'<p class="small muted">江湖暫無交戰，亦可選擇勢力出兵測試戰爭模擬。</p>'}<h3>戰爭與商貿紀事</h3>${x.history.slice(0,16).map(e=>`<div class="event-chip"><b>${safe(e.title)}</b><span class="small muted"> · 第${e.day}日</span><p>${safe(e.detail)}</p></div>`).join('')||'<p class="small muted">尚無紀事。</p>'}`;}
const v10OldEnemyTurn=enemyTurn;
enemyTurn=function(){if(!battle)return;const id=lifeEnsure().companion;if(id){const x=v10Ensure(),c=x.companion[id];if(c.hp>0){if(id==='su'){let heal=Math.min(18,S.maxHp-S.hp);if(heal>0&&c.mp>=8){S.hp+=heal;c.mp-=8;writeLog(`蘇晚晴施展回春針法，為你回復 ${heal} 氣血。`);}else{c.mp=Math.min(c.maxMp,c.mp+4);writeLog('蘇晚晴凝神調息，準備下一次救治。');}}else{let dmg=id==='gu'?rand(16,26):rand(12,23);if(c.mp>=6){c.mp-=6;dmg+=6;}else c.mp=Math.min(c.maxMp,c.mp+3);battle.hp-=dmg;writeLog(`${DESTINY_NAMES[id]}出手支援，造成 ${dmg} 傷害。`);if(battle.hp<=0){win();return;}}}}v10OldEnemyTurn();};

function v12Bound(value,min,max,fallback=min){const n=Number(value);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):fallback;}
function v12Repair(){if(!S)return;const x=v10Ensure(),q=v11Ensure(),l=lifeEnsure();for(const [place,m] of Object.entries(x.markets)){for(const g of Object.keys(V10_GOODS)){m.stock[g]=Math.round(v12Bound(m.stock[g],0,150,8));m.demand[g]=Math.round(v12Bound(m.demand[g],4,25,8));}let tr=q.merchants[place];tr.cash=Math.round(v12Bound(tr.cash,0,2000,200));tr.transactions=Math.max(0,Math.round(v12Bound(tr.transactions,0,10000000)));tr.profit=Math.round(v12Bound(tr.profit,-100000000,100000000,0));}for(const [id,t] of Object.entries(x.territories)){if(!FACTION_META[t.owner])t.owner=V10_TERRITORIES[id].owner;t.fort=Math.round(v12Bound(t.fort,0,100,25));}for(const w of x.wars){w.attack=Math.round(v12Bound(w.attack,0,10000));w.defense=Math.round(v12Bound(w.defense,0,10000));w.round=Math.round(v12Bound(w.round,0,100));if(!FACTION_META[w.attacker]||!FACTION_META[w.defender]||!places[w.target])w.active=false;}for(const c of Object.values(x.companion)){c.maxHp=Math.round(v12Bound(c.maxHp,1,1000,80));c.maxMp=Math.round(v12Bound(c.maxMp,1,1000,50));c.hp=Math.round(v12Bound(c.hp,0,c.maxHp,c.maxHp));c.mp=Math.round(v12Bound(c.mp,0,c.maxMp,c.maxMp));}for(const f of Object.values(l.factions))f.power=Math.round(v12Bound(f.power,0,100,50));}
function v12Audit(){if(!S)return {ok:false,errors:['無遊戲資料']};const errors=[],x=v10Ensure(),q=v11Ensure(),l=lifeEnsure();const check=(v,lo,hi,path)=>{if(!Number.isFinite(v)||v<lo||v>hi)errors.push(`${path}: ${v}`);};check(S.day,1,1000000,'遊戲日');check(S.hour,0,23,'遊戲時辰');for(const [p,m] of Object.entries(x.markets)){for(const g of Object.keys(V10_GOODS)){check(m.stock[g],0,150,`${p}.${g}.stock`);check(m.demand[g],4,25,`${p}.${g}.demand`);check(v10Price(p,g),2,V10_GOODS[g].base*3,`${p}.${g}.price`);}check(q.merchants[p].cash,0,2000,`${p}.merchant.cash`);if(!FACTION_META[x.territories[p].owner])errors.push(`${p}.owner invalid`);}for(const w of x.wars){check(w.attack,0,10000,'war.attack');check(w.defense,0,10000,'war.defense');if(w.active&&(!FACTION_META[w.attacker]||!FACTION_META[w.defender]||!places[w.target]))errors.push('invalid active war');}if(x.wars.filter(w=>w.active).length>2)errors.push('more than two active wars');for(const [id,c] of Object.entries(x.companion)){check(c.hp,0,c.maxHp,`${id}.hp`);check(c.mp,0,c.maxMp,`${id}.mp`);}for(const [id,f] of Object.entries(l.factions))check(f.power,0,100,`${id}.power`);for(const id of ['su','gu','ye']){const person=l.people[id];if(!person||(person.place!==null&&!places[person.place]))errors.push(`${id}.life.place invalid`);const bond=S.world.bonds?.people?.[id];if(!bond)errors.push(`${id}.bond missing`);else for(const key of ['trust','affection','respect','grudge'])if(bond[key]!==undefined)check(bond[key],-100,100,`${id}.bond.${key}`);}if(q.lastDay>S.day||x.lastDay>S.day||l.lastDay>S.day)errors.push('future processed day');return {ok:errors.length===0,errors};}

function v12Snapshot(){const x=v10Ensure(),q=v11Ensure();return {day:S.day,wars:q.stats.wars,caravans:q.stats.caravans,active:x.wars.filter(w=>w.active).length,merchants:Object.values(q.merchants).reduce((a,m)=>a+m.cash,0),stock:Object.values(x.markets).reduce((a,m)=>a+Object.values(m.stock).reduce((u,v)=>u+v,0),0),territories:Object.fromEntries(Object.entries(x.territories).map(([p,t])=>[p,t.owner]))};}
/* Tests operate on a deep copy; never overwrite the player's saved game. */
function v12RunRegression(days=30,seed=12345){if(!S||battle)return {ok:false,errors:['請在非戰鬥狀態執行']};days=Number(days);if(![30,100,300].includes(days))return {ok:false,errors:['測試日數必須是 30、100 或 300']};const original=S,oldTab=tab,errors=[],snapshots=[];let xseed=(Number(seed)>>>0)||12345;const oldRandom=Math.random;try{S=JSON.parse(JSON.stringify(original));Math.random=function(){xseed=(Math.imul(1664525,xseed)+1013904223)>>>0;return xseed/4294967296;};v12Repair();for(let d=1;d<=days;d++){tick(24);if(d%10===0||d===days){const a=v12Audit();if(!a.ok)errors.push(...a.errors.slice(0,5).map(e=>`第 ${d} 日：${e}`));snapshots.push(v12Snapshot());}if(errors.length>25)break;}const before=JSON.stringify(S);const restored=JSON.parse(before);if(JSON.stringify(restored)!==before)errors.push('存檔 JSON 往返不一致');const sim=v10Ensure();if(sim.wars.filter(w=>w.active).length>2)errors.push('戰爭併發超出限制');return {ok:errors.length===0,days,seed,wars:v11Ensure().stats.wars,caravans:v11Ensure().stats.caravans,final:v12Snapshot(),snapshots,errors};}catch(e){return {ok:false,days,seed,errors:[...errors,String(e&&e.stack||e)]};}finally{Math.random=oldRandom;S=original;tab=oldTab;}}
function v12TestAndShow(days){const result=v12RunRegression(days,20261115);const x=v12Ensure();x.history.unshift({day:S.day,testDays:days,ok:result.ok,wars:result.wars||0,caravans:result.caravans||0,errors:result.errors||[],snapshot:result.final||null});x.history=x.history.slice(0,12);writeLog(`長期測試 ${days} 日：${result.ok?'通過':'發現異常'}。`);auto();render();}
function v12Dashboard(){const r=v12Ensure(),q=v11Ensure(),audit=v12Audit(),last=r.history[0];return `<h2>世界穩定性 · 回歸測試</h2><p class="small muted">在獨立的暫存世界執行 30／100／300 日測試，不會改變目前角色、NPC 關係、金錢、領地或遊戲日數。固定亂數種子可重現測試結果。</p><div class="actions">${btn('測試 30 日','v12TestAndShow(30)')}${btn('測試 100 日','v12TestAndShow(100)')}${btn('測試 300 日','v12TestAndShow(300)')}</div><div class="notice">目前存檔檢核：${audit.ok?'通過':'異常 '+safe(audit.errors.join('、'))}<br>累計模擬 ${q.stats.days} 日 · 自主宣戰 ${q.stats.wars} 次 · 商隊成功 ${q.stats.caravans} 趟</div><h3>最近測試結果</h3>${last?`<div class="tile"><b>${last.testDays} 日測試：${last.ok?'通過':'失敗'}</b><p class="small">宣戰 ${last.wars} 次 · 商隊 ${last.caravans} 趟</p>${last.errors.length?`<p>${safe(last.errors.join('；'))}</p>`:'<p class="small muted">價格、庫存、商人現銀、兵力、勢力與隊友狀態未發現越界。</p>'}</div>`:'<p class="small muted">尚未執行測試。</p>'}<h3>平衡邊界</h3><p class="small">市場庫存 0–150 · 需求 4–25 · 商品售價不超過基準價 3 倍 · 商人現銀 0–2000 · 勢力強度 0–100 · 同時最多 2 場戰爭。</p><p class="small muted">本測試檢查數值與資料一致性，不等同完整劇情、所有操作路徑或手機瀏覽器相容性測試。</p>`;}
const v12PrevRender=render;render=function(){if(!S)return;v12Ensure();v12PrevRender();$('tabs').insertAdjacentHTML('beforeend',`<button class="${tab==='穩定測試'?'active':''}" onclick="changeTab('穩定測試')">穩定測試</button>`);if(tab==='穩定測試')$('scene').innerHTML=v12Dashboard();};
const v12PrevContinue=continueGame;continueGame=function(){v12PrevContinue();if(S){v12Repair();v12Ensure();render();}};
const v12PrevNew=newGame;newGame=function(){v12PrevNew();if(S){v12Repair();v12Ensure();render();}};
